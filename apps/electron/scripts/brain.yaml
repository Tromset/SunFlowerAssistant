# brain.yaml — folder variables (brAIn rule 6)
name: scripts
purpose: "esbuild bundling, app packaging, icon generation, and the always-on budget check."
parent: ../brain.yaml
children: []
files:
  README.md: "This folder's hub"
  build.mjs: "esbuild bundler for main, preload and renderers; copies static assets; runs the budget check"
