  loop-budget.json: "The declared budget of permitted recurring timers and probes"
  make-app.mjs: "Builds the Finder `SunFlower.app` terminal-launcher shortcut bundle"
  make-icon.mjs: "Generates `SunFlower.icns` from the pixel-art icon source"
