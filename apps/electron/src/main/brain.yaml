# brain.yaml — folder variables (brAIn rule 6)
name: main
purpose: "Electron main process (Node): session orchestration, pipelines, windows, tray, TUI, harnesses."
parent: ../brain.yaml
children:
  - claude/brain.yaml
  - code/brain.yaml
  - windows/brain.yaml
  - work/brain.yaml
files:
  README.md: "This folder's hub"
  index.ts: "Entry point: IPC handlers, windows, tray, hotkey, lifecycle, `routeToCode()`, `shutdownEverything()`"
  state-machine.ts: "The voice/typed session orchestrator: idle → listen → think → answer → guide"
  ollama.ts: "Ollama client: `/api/tags`, `/api/ps`, streamed `/api/chat`, warm-up, context budget, `<think>` stripping"
  stt.ts: "whisper.cpp: model download, load, resample, transcribe"
  screenshot.ts: "`captureScreenAtCursor()` — JPEG of the display under the cursor"
  guide-parser.ts: "Streaming `[POINT]`/`[STEP]`/`[WORK]` marker extraction + coordinate normalisation"
  guide-runner.ts: "Deterministic guide execution: advances steps via proximity and clicks"
  point-verifier.ts: "DOM-first, vision-second pointing refinement"
  dom-locator.ts: "Reads the frontmost browser's DOM to snap pointer targets to real elements"
  activity.ts: "Event-driven frontmost app / tab URL detection for moods"
  presence.ts: "Real-vs-synthetic input tracking (idle detection, clicker suppression)"
  hotkey.ts: "uiohook global hooks: `⌃⌥` push-to-talk, clicks, backoff retry"
  permissions.ts: "macOS permission status and requests (mic, accessibility, screen)"
  config-store.ts: "Atomic JSON config in userData (`config.json`)"
  shell-guard.ts: "Shared destructive-shell-command blacklist"
  watchdog.ts: "Per-process CPU/RSS JSONL sampler"
  tray.ts: "Menu-bar tray icon and context menu"
  pixel-png.ts: "Pixel art → PNG buffers for the tray (1× and 2×)"
  tui.ts: "Interactive terminal UI: prompt, stream, pickers, slash commands"
  tui-pixel.ts: "Renders shared pixel art as half-block truecolor terminal lines"
  tui-ansi.ts: "ANSI colour, box-drawing and visible-width helpers"
  tui-theme.ts: "TUI role labels, block wordmark font, branding"
when_to_read:
  "Where are IPC handlers and app wiring?": index.ts
  "How does a voice session flow?": state-machine.ts
  "How is Ollama called and kept warm?": ollama.ts
  "How is speech transcribed locally?": stt.ts
  "How are pointing/guide markers parsed?": guide-parser.ts
  "How is the coding harness implemented?": code/README.md
  "How does the errand runner work?": work/README.md
  "How does the Claude Code bridge work?": claude/README.md
  "Where are windows created?": windows/README.md
  "How does the terminal UI render?": tui.ts
links: {}
